[package]
name = "code-maestro"
version = "0.1.0"
edition = "2021"
authors = ["Your Team"]
description = "AI-Powered Developer Tool with Desktop Code Editor"

[workspace]
members = ["src-tauri", "src-core"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[[bin]]
name = "code-maestro"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
tower = "0.4"
tower-lsp = "0.20"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
rusqlite = { version = "0.30", features = ["bundled"] }
regex = "1.10"
walkdir = "2.4"
uuid = { version = "1.6", features = ["v4", "serde"] }
notify = "6.1"
tempfile = "3.8"

[dev-dependencies]
tokio-test = "0.4"
